name: CI Build

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: CI Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 cmake;3.22.1'
          accept-android-sdk-licenses: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare bundled production payloads
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/payloads"
          git clone --quiet --depth=1 --branch main \
            "https://github.com/exfurr-bash/UltraRoot-My-Galaxy-Payloads.git" \
            "$RUNNER_TEMP/payloads"
          python3 .github/scripts/prepare_production_payload_bundle.py "$RUNNER_TEMP/payloads"
          test -s app/src/main/assets/production-payloads/targets-v3.json
          test -s app/src/main/jniLibs/arm64-v8a/libcve43499root.so
          rm -rf "$RUNNER_TEMP/payloads"

      - name: Test and build debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
