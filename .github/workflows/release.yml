name: Release Build

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to publish, or leave blank to use the latest v* tag
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Release Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 cmake;3.22.1'
          accept-android-sdk-licenses: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve release tag
        id: release_tag
        shell: bash
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail

          git fetch --tags --force
          VERSION_NAME="$(grep -oE 'versionName[[:space:]]*=[[:space:]]*"[^"]+"' app/build.gradle.kts | head -n 1 | cut -d'"' -f2)"
          EXPECTED_TAG="v$VERSION_NAME"

          if [ -n "$INPUT_TAG_NAME" ]; then
            TAG_NAME="$INPUT_TAG_NAME"
          else
            TAG_NAME="$EXPECTED_TAG"
          fi

          if [ -z "$TAG_NAME" ]; then
            echo "No release tag found." >&2
            exit 1
          fi

          if [ "$TAG_NAME" != "$EXPECTED_TAG" ]; then
            echo "Tag $TAG_NAME does not match app version $VERSION_NAME (expected $EXPECTED_TAG)." >&2
            exit 1
          fi

          if ! git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            git push origin "refs/tags/$TAG_NAME"
          fi

          TAG_COMMIT="$(git rev-list -n 1 "$TAG_NAME")"
          PREVIOUS_TAG="$(git tag --list 'v*' --sort=-v:refname | grep -Fxv "$TAG_NAME" | head -n 1 || true)"

          {
            echo "tag_name=$TAG_NAME"
            echo "version_name=$VERSION_NAME"
            echo "tag_commit=$TAG_COMMIT"
            echo "previous_tag=$PREVIOUS_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        shell: bash
        env:
          TAG_NAME: ${{ steps.release_tag.outputs.tag_name }}
        run: |
          set -euo pipefail
          git checkout --force "$TAG_NAME"

      - name: Prepare bundled production payloads
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/payloads"
          git clone --quiet --depth=1 --branch main \
            "https://github.com/exfurr-bash/UltraRoot-My-Galaxy-Payloads.git" \
            "$RUNNER_TEMP/payloads"
          python3 .github/scripts/prepare_production_payload_bundle.py "$RUNNER_TEMP/payloads" \
            | tee "$RUNNER_TEMP/payload-provenance.txt"
          test -s app/src/main/assets/production-payloads/targets-v3.json
          rm -rf "$RUNNER_TEMP/payloads"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "No KEYSTORE_BASE64 secret; release APK will be unsigned."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > release.keystore
          chmod 600 release.keystore

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon

      - name: Generate release notes
        shell: bash
        env:
          TAG_NAME: ${{ steps.release_tag.outputs.tag_name }}
          VERSION_NAME: ${{ steps.release_tag.outputs.version_name }}
          TAG_COMMIT: ${{ steps.release_tag.outputs.tag_commit }}
          PREVIOUS_TAG: ${{ steps.release_tag.outputs.previous_tag }}
        run: |
          set -euo pipefail

          {
            echo "# Release $TAG_NAME"
            echo
            echo "Version: $VERSION_NAME"
            echo "Commit: $TAG_COMMIT"
            echo
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "Changes since $PREVIOUS_TAG:"
              echo
              git log --format='- %s' "$PREVIOUS_TAG..$TAG_NAME"
            else
              echo "First tagged release."
            fi
          } > release-notes.md
          if [ -s "$RUNNER_TEMP/payload-provenance.txt" ]; then
            {
              echo
              echo "### Payload provenance"
              echo
              sed 's/^/- /' "$RUNNER_TEMP/payload-provenance.txt"
            } >> release-notes.md
          fi

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release_tag.outputs.tag_name }}
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --title "Release $TAG_NAME" \
              --notes-file release-notes.md \
              --latest
            gh release upload "$TAG_NAME" app/build/outputs/apk/release/*.apk --clobber
          else
            gh release create "$TAG_NAME" app/build/outputs/apk/release/*.apk \
              --title "Release $TAG_NAME" \
              --notes-file release-notes.md \
              --latest
          fi